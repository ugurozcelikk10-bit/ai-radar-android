name: Build Android APK (Ugur Coins v3 PRO)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          git zip unzip curl autoconf automake libtool pkg-config \
          build-essential cmake zlib1g-dev libffi-dev libssl-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 libsqlite3-dev

      # -------- ANDROID SDK (HATASIZ) ----------
      - name: Install Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ---------- BUILD ----------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          ls -R output || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UgurCoins-V3-APK
          path: output/*.apk
          if-no-files-found: warn
