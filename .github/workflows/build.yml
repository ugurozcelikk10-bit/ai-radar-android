name: Build Android APK (Ugur Coins V3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl autoconf automake libtool pkg-config \
            build-essential cmake zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 libatlas-base-dev \
            gfortran libsqlite3-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Clean Build Cache
        run: |
          buildozer android clean || true
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Collect APK
        if: always()
        run: |
          mkdir -p output
          find bin/ -name "*.apk" -exec cp {} output/ \; || true
          find .buildozer/android/platform -name "*.apk" -exec cp {} output/ \; || true
          ls -lah output || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UgurCoins-V3-APK
          path: output/*.apk
          if-no-files-found: warn

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v3
          path: build_log.txt
