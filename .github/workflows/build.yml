name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip python3 python3-pip python3-venv \
          autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 libffi-dev libssl-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept ALL licenses + preinstall tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython

      - name: Force Buildozer auto SDK download
        run: |
          mkdir -p ~/.buildozer
          echo "[app]" > ~/.buildozer/android.ini
          echo "android.accept_sdk_license = True" >> ~/.buildozer/android.ini
          echo "android.skip_update = False" >> ~/.buildozer/android.ini

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-radar-apk
          path: bin/*.apk
