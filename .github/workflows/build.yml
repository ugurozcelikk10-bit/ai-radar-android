name: Build Android APK (Ugur Coins v3 PRO)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool pkg-config \
            build-essential cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            libsqlite3-dev

      - name: Install Android SDK cmdline-tools + packages
        run: |
          set -e

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$ANDROID_SDK_ROOT"

          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          rm -f cmdline.zip

          # Google yeni yapıda: cmdline-tools klasörü direkt geliyor
          mv cmdline-tools cmdline-tools/latest

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Install Buildozer + Cython (pinned)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Clean build caches
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Collect APK
        if: always()
        run: |
          mkdir -p output
          find bin/ -name "*.apk" -exec cp {} output/ \; || true
          find .buildozer -name "*.apk" -exec cp {} output/ \; || true

          echo "---- OUTPUT ----"
          ls -lah output || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UgurCoins-V3-APK
          path: output/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v3
          path: build_log.txt
          if-no-files-found: warn
